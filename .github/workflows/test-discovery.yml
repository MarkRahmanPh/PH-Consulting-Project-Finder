name: PH Project Finder regression tests

on:
  push:
    branches: [main]
    paths:
      - 'update.py'
      - 'agency_sources.py'
      - 'procurement_sources.py'
      - 'test_discovery.py'
      - '.github/workflows/test-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile update.py agency_sources.py procurement_sources.py test_discovery.py
      - name: Run regression tests
        run: python -m unittest -v test_discovery
