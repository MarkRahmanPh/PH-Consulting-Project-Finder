name: Daily PH opportunity discovery
on:
  # Test and refresh immediately after source/recognition fixes, not just hourly.
  # Generated opportunities.json commits are excluded to prevent update loops.
  push:
    branches: [main]
    paths:
      - 'update.py'
      - 'agency_sources.py'
      - 'procurement_sources.py'
      - 'test_discovery.py'
      - '.github/workflows/daily-update.yml'
  schedule:
    - cron: '17 * * * *' # Run hourly at :17 UTC (also :17 Pacific); GitHub may delay scheduled runs
  workflow_dispatch:
permissions:
  contents: write
# Keep a scheduled scan and a code-triggered scan from racing to push JSON.
concurrency:
  group: ph-project-finder-opportunity-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate search scripts
        run: python -m py_compile update.py agency_sources.py procurement_sources.py
      - name: Test opportunity matching and bid IDs
        run: python -m unittest -q test_discovery
      - name: Search PH opportunities across 40 rotating agencies
        env:
          PH_AGENCY_BATCH: '40'
        run: python update.py
      - name: Commit refreshed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add opportunities.json
          git diff --cached --quiet || (git commit -m 'Daily opportunity discovery refresh' && git push)
