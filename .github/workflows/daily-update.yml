name: Daily PH opportunity discovery
on:
  schedule:
    - cron: '17 * * * *' # Run hourly at :17 UTC (also :17 Pacific); GitHub may delay scheduled runs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search PH opportunities across 32 rotating agencies
        env:
          PH_AGENCY_BATCH: '32'
        run: python update.py
      - name: Commit refreshed feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add opportunities.json
          git diff --cached --quiet || (git commit -m 'Daily opportunity discovery refresh' && git push)
