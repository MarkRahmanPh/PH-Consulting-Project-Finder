<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PH Consulting Contact Hub</title><style>body{font:15px system-ui;background:#f3f6fb;color:#203047;margin:0}header{background:#163e60;color:white;padding:20px}main{max-width:1100px;margin:25px auto;padding:16px}.panel{background:white;padding:20px;border-radius:12px;margin-bottom:16px;box-shadow:0 3px 12px #0001}input,select,textarea,button{font:inherit;padding:10px;margin:5px 0;border:1px solid #cbd5e1;border-radius:7px;box-sizing:border-box}input,textarea{width:100%}button{background:#1763ad;color:white;cursor:pointer}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #e5e7eb;padding:9px}small{color:#64748b}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.error{color:#b42318}a{color:#1763ad}</style><header><h2>PH Consulting | Contact Hub</h2><div>Private team workspace · <a style="color:white" href="../">Project Finder</a></div></header><main><section id="login" class="panel"><h3>Staff sign-in</h3><p>Use your authorized PH Consulting email address. A sign-in link will be sent to your inbox.</p><input id="email" type="email" placeholder="name@company.com"><button id="send">Email me a sign-in link</button><p id="loginMsg"></p></section><section id="app" class="hidden"><div class="panel"><span id="who"></span> <button id="logout">Sign out</button><p id="status"></p></div><section class="panel"><h3>Contacts</h3><input id="search" placeholder="Search name, email, agency or notes"><div id="contacts"></div></section><section class="panel"><h3>Add contact</h3><form id="contactForm"><div class="grid"><input name="first_name" placeholder="First name" required><input name="last_name" placeholder="Last name"><input name="title" placeholder="Job title"><input name="email" type="email" placeholder="Email"><input name="phone" placeholder="Phone"><select name="agency_id" id="agency"><option value="">No agency</option></select></div><textarea name="notes" placeholder="Notes"></textarea><button>Add contact</button></form></section><section class="panel"><h3>Add agency</h3><form id="agencyForm"><div class="grid"><input name="name" placeholder="Agency name" required><input name="city" placeholder="City"><input name="state" placeholder="State"></div><button>Add agency</button></form></section><section class="panel"><h3>Follow-ups</h3><div id="followups"></div></section></section></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://gcrgrcdyomirjyyjocbu.supabase.co','sb_publishable_KQ8bovtkz7vuEqutQJjq4Q_8tA82y3g');
const $=id=>document.getElementById(id);let agencies=[],contacts=[];
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('send').onclick=async()=>{const email=$('email').value.trim();if(!email)return;const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});$('loginMsg').textContent=error?.message||'Check your email for the sign-in link.'};
$('logout').onclick=()=>supabase.auth.signOut();
async function load(){const [a,c,f]=await Promise.all([supabase.from('agencies').select('*').order('name'),supabase.from('contacts').select('*').order('first_name'),supabase.from('follow_ups').select('*').order('due_date')]);if(a.error||c.error||f.error){$('status').textContent='Access not yet enabled for this account. Ask the workspace administrator to add your user ID and email to staff_members.';return;}agencies=a.data;contacts=c.data;$('agency').innerHTML='<option value="">No agency</option>'+agencies.map(x=>'<option value="'+escape(x.id)+'">'+escape(x.name)+'</option>').join('');render();$('followups').innerHTML=f.data.length?'<table><tr><th>Task</th><th>Due</th><th>Status</th></tr>'+f.data.map(x=>'<tr><td>'+escape(x.title)+'</td><td>'+escape(x.due_date)+'</td><td>'+escape(x.status)+'</td></tr>').join('')+'</table>':'No follow-ups yet.';$('status').textContent=contacts.length+' contacts · '+agencies.length+' agencies';}
function render(){const q=$('search').value.toLowerCase();const rows=contacts.filter(c=>[c.first_name,c.last_name,c.email,c.notes,agencies.find(a=>a.id===c.agency_id)?.name].join(' ').toLowerCase().includes(q));$('contacts').innerHTML=rows.length?'<table><tr><th>Name</th><th>Agency</th><th>Email</th><th>Notes</th></tr>'+rows.map(c=>'<tr><td>'+escape([c.first_name,c.last_name].filter(Boolean).join(' '))+'</td><td>'+escape(agencies.find(a=>a.id===c.agency_id)?.name)+'</td><td>'+escape(c.email)+'</td><td>'+escape(c.notes)+'</td></tr>').join('')+'</table>':'No matching contacts.';}
$('search').oninput=render;
$('contactForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));if(!data.agency_id)data.agency_id=null;const {error}=await supabase.from('contacts').insert(data);if(error)alert(error.message);else{e.target.reset();await load();}};
$('agencyForm').onsubmit=async e=>{e.preventDefault();const {error}=await supabase.from('agencies').insert(Object.fromEntries(new FormData(e.target)));if(error)alert(error.message);else{e.target.reset();await load();}};
async function session(){const {data:{session}}=await supabase.auth.getSession();$('login').classList.toggle('hidden',!!session);$('app').classList.toggle('hidden',!session);if(session){$('who').textContent=session.user.email;await load();}}supabase.auth.onAuthStateChange(()=>setTimeout(session,0));session();
</script></html>
